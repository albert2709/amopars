<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>amoPars Caller & SMS</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="popup-body">
    <main class="popup-card">
      <button id="open-settings" class="icon-button" title="Настройки" aria-label="Настройки">⚙</button>
      <h1>amoPars</h1>
      <p class="subtitle">Получение номера по XPath и отправка в API.</p>

      <label class="field-label" for="message-text">Текст SMS / MAX</label>
      <textarea id="message-text" rows="4" placeholder="Введите текст сообщения"></textarea>

      <div class="actions">
        <button id="call-button" class="primary-button">Позвонить</button>
        <button id="sms-button" class="secondary-button">Отправить SMS</button>
      </div>

      <div id="status" class="status" aria-live="polite"></div>
      <div id="queue-info" class="queue-info"></div>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
